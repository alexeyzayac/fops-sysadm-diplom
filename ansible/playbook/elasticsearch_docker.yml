---
- name: Deploy Elasticsearch in Docker
  hosts: elasticsearch
  become: true
  gather_facts: true

  vars:
    elasticsearch_image: docker.elastic.co/elasticsearch/elasticsearch:8.19.11

  tasks:
    - name: Create data directory
      ansible.builtin.file:
        path: /elasticsearch/data
        state: directory
        owner: 1000
        group: 1000
        mode: "0770"

    - name: Create logs directory
      ansible.builtin.file:
        path: /elasticsearch/logs
        state: directory
        owner: 1000
        group: 1000
        mode: "0770"

    - name: Pull Elasticsearch image
      community.docker.docker_image:
        name: "{{ elasticsearch_image }}"
        source: pull

    - name: Remove old container if exists
      community.docker.docker_container:
        name: elasticsearch-server
        state: absent
        force_kill: true

    - name: Run Elasticsearch container
      community.docker.docker_container:
        name: elasticsearch-server
        image: "{{ elasticsearch_image }}"
        restart_policy: unless-stopped
        published_ports:
          - "9200:9200"
        env:
          discovery.type: single-node
          cluster.name: "alexey-zayac"
          network.host: "0.0.0.0"
          xpack.security.enabled: "false"
        volumes:
          - "/elasticsearch/data:/usr/share/elasticsearch/data"
          - "/elasticsearch/logs:/usr/share/elasticsearch/logs"
        state: started