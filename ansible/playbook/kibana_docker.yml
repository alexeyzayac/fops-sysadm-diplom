---
- name: Deploy Kibana in Docker
  hosts: kibana
  become: true
  gather_facts: true

  vars:
    kibana_image: docker.elastic.co/kibana/kibana:8.19.11
    elasticsearch_host: "http://{{ hostvars['elasticsearch-server']['ansible_host'] }}:9200"

  tasks:
    - name: Pull Kibana image
      community.docker.docker_image:
        name: "{{ kibana_image }}"
        source: pull

    - name: Remove old container if exists
      community.docker.docker_container:
        name: kibana-server
        state: absent
        force_kill: true

    - name: Run Kibana container
      community.docker.docker_container:
        name: kibana-server
        image: "{{ kibana_image }}"
        restart_policy: unless-stopped
        published_ports:
          - "5601:5601"
        env:
          SERVER_HOST: "0.0.0.0"
          ELASTICSEARCH_HOSTS: "{{ elasticsearch_host }}"
        state: started